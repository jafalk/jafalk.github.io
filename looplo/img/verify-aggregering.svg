  <text class="l" x="616" y="300">Forbeholdet</text>
  <text class="s" x="616" y="318">hvad beviset ikke dækker</text>
  <text class="h" x="600" y="106">UD, TIL MARKEDET</text>
  <rect x="26" y="368" width="828" height="46" rx="5" fill="#F4F6F8" stroke="#D8DEE6" stroke-dasharray="5 4"/>
  <text class="h" x="42" y="388">FORLADER ALDRIG DEN ENKELTE PART</text>
  <text class="b" x="42" y="406">rå logdata · kundenavne · prissætning · kildekode · alt det de er konkurrenter på</text>
  <text class="b" x="26" y="440">Hvor laget kører, og hvem der holder nøglerne, afgør hvem der kan lukke det. Det er et valg, ikke en teknikalitet.</text>
  <line x1="26" y1="454" x2="854" y2="454" stroke="#D8DEE6"/>
  <text class="f" x="26" y="474">Fire kilder leverer ind. Ingen af dem kan læse hinandens grundlag.</text>
  <text class="fk" x="854" y="474" text-anchor="end">Hvem kan slukke laget</text>
</svg>