<text x="86" y="352" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#14294A">Zero Trust og suverænitet · 7 underdimensioner</text>
<rect x="840" y="320" width="504" height="168" rx="10" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.3"/>
<text x="866" y="352" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#14294A">Domænescore</text>
<text x="866" y="412" text-anchor="start" font-family="Arial" font-size="52" font-weight="bold" fill="#2E7D4F">6</text>
<text x="920" y="412" text-anchor="start" font-family="Arial" font-size="14" fill="#7C8AA0">af 9</text>
<text x="866" y="440" text-anchor="start" font-family="Arial" font-size="11.5" fill="#425571">Vægtet gennemsnit af syv underdimensioner. Vægtsættet er</text>
<text x="866" y="456" text-anchor="start" font-family="Arial" font-size="11.5" fill="#425571">versioneret, ellers kan to målinger ikke sammenlignes</text>
<text x="866" y="472" text-anchor="start" font-family="Arial" font-size="11.5" fill="#425571">over tid.</text>
<rect x="840" y="504" width="504" height="168" rx="10" fill="#FBF3F2" stroke="#E4B4B0" stroke-width="1.4"/>
<text x="866" y="536" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#B23A3A">Svageste underdimension</text>
<text x="866" y="562" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Dataklassifikation står på 3 og vejer 15%. Den driver</text>
<text x="866" y="579" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">gæld mod både AI og Cloud - to koblinger, én årsag.</text>
<text x="866" y="650" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold" fill="#B23A3A">Skjult af gennemsnittet</text>
<rect x="840" y="688" width="504" height="172" rx="10" fill="#EDF1F7" stroke="#DDE3EC" stroke-width="1.3"/>
<text x="866" y="720" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#14294A">Hvorfor spindelvæv her</text>
<text x="866" y="746" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Inde i ét domæne er akserne underdimensioner, og formen</text>
<text x="866" y="763" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">viser hvor skævt det står. På tværs af de fem domæner</text>
<text x="866" y="780" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">duer det ikke - der er koblingerne produktet, og dem kan</text>
<text x="866" y="797" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">en radar ikke tegne.</text>
</svg>