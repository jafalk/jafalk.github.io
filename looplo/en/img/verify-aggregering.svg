  <text class="h" x="600" y="106">OUT, TO THE MARKET</text>
  <rect x="26" y="368" width="828" height="46" rx="5" fill="#F4F6F8" stroke="#D8DEE6" stroke-dasharray="5 4"/>
  <text class="h" x="42" y="388">NEVER LEAVES THE INDIVIDUAL PARTY</text>
  <text class="b" x="42" y="406">raw log data · client names · pricing · source code · everything they compete on</text>
  <text class="b" x="26" y="440">Where the layer runs, and who holds the keys, decides who can shut it down. That is a choice, not a technicality.</text>
  <line x1="26" y1="454" x2="854" y2="454" stroke="#D8DEE6"/>
  <text class="f" x="26" y="474">Four sources feed in. None of them can read each other's basis.</text>
  <text class="fk" x="854" y="474" text-anchor="end">Who can switch off the layer</text>
