<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#FBFBFC"/>
<text x="56" y="52" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#3E5C76">6 · UDLEDER</text>
<text x="56" y="90" text-anchor="start" font-family="Arial" font-size="27" font-weight="bold" fill="#14294A">Risikoanalyse</text>
<text x="56" y="118" text-anchor="start" font-family="Arial" font-size="14" fill="#425571">Hvor koblingsgælden bliver til en hændelse. Her kan et bestyrelsesreferat pege på et ejerskabshul, før det bliver en sag.</text>
<rect x="56" y="160" width="1288" height="470" rx="10" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.3"/>
<text x="90" y="200" text-anchor="start" font-family="Arial" font-size="11" font-weight="bold" fill="#7C8AA0">KOBLING</text>
<text x="290" y="200" text-anchor="start" font-family="Arial" font-size="11" font-weight="bold" fill="#7C8AA0">HVAD DER SKER</text>
<text x="640" y="200" text-anchor="start" font-family="Arial" font-size="11" font-weight="bold" fill="#7C8AA0">HVAD DER UDLØSER DEN</text>
<text x="930" y="200" text-anchor="start" font-family="Arial" font-size="11" font-weight="bold" fill="#7C8AA0">HVEM SVARER I DAG</text>
<text x="1210" y="200" text-anchor="start" font-family="Arial" font-size="11" font-weight="bold" fill="#7C8AA0">HVORNÅR</text>
<line x1="86" y1="214" x2="1314" y2="214" stroke="#DDE3EC" stroke-width="1.2"/>
<text x="90" y="250" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#B23A3A">ZT × AI</text>
<text x="290" y="250" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">Model tilgår data uden kendt</text>
<text x="290" y="265" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">hjemmel</text>
<text x="640" y="250" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Aktindsigt eller tilsynsbesøg</text>
<text x="930" y="250" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold" fill="#B23A3A">Ingen udpeget</text>
<text x="1210" y="250" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Ved tilsyn. Ikke</text>
<text x="1210" y="265" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">før.</text>
<line x1="86" y1="306" x2="1314" y2="306" stroke="#DDE3EC" stroke-width="0.8"/>
<text x="90" y="324" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#B23A3A">AI × ZT</text>
<text x="290" y="324" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">Datagrundlag uden klassifikation i</text>
<text x="290" y="339" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">drift</text>
<text x="640" y="324" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Datasæt med personoplysninger</text>
<text x="930" y="324" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold" fill="#B23A3A">Ingen udpeget</text>
<text x="1210" y="324" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Ved</text>
<text x="1210" y="339" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">indsigtsanmodning</text>
<line x1="86" y1="380" x2="1314" y2="380" stroke="#DDE3EC" stroke-width="0.8"/>
<text x="90" y="398" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#B23A3A">ZT × EQ</text>
<text x="290" y="398" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">Hændelse opdages sent, den meldes</text>
<text x="290" y="413" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">ikke</text>
<text x="640" y="398" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Nogen ser noget og siger det</text>
<text x="640" y="413" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">ikke</text>
<text x="930" y="398" text-anchor="start" font-family="Arial" font-size="12" fill="#7C8AA0">Sikkerhedschef, uden</text>
<text x="930" y="413" text-anchor="start" font-family="Arial" font-size="12" fill="#7C8AA0">mandat</text>
<text x="1210" y="398" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Uger. Tre sidst.</text>
<line x1="86" y1="454" x2="1314" y2="454" stroke="#DDE3EC" stroke-width="0.8"/>
<text x="90" y="472" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#7C8AA0">AI × EQ</text>
<text x="290" y="472" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">Modelfejl løber igennem, ingen</text>
<text x="290" y="487" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">siger fra</text>
<text x="640" y="472" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Forkert anbefaling i en</text>
<text x="640" y="487" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">enkeltsag</text>
<text x="930" y="472" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold" fill="#B23A3A">Ingen. Ansvarsmodel</text>
<text x="930" y="487" text-anchor="start" font-family="Arial" font-size="12" font-weight="bold" fill="#B23A3A">mangler</text>
<text x="1210" y="472" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Når borgeren</text>
<text x="1210" y="487" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">klager</text>
<line x1="86" y1="528" x2="1314" y2="528" stroke="#DDE3EC" stroke-width="0.8"/>
<text x="90" y="546" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#7C8AA0">CL × EQ</text>
<text x="290" y="546" text-anchor="start" font-family="Arial" font-size="12" fill="#14294A">Ukendt. Ingen har set efter</text>
<text x="640" y="546" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Ubekendt</text>
<text x="930" y="546" text-anchor="start" font-family="Arial" font-size="12" fill="#7C8AA0">Ubekendt</text>
<text x="1210" y="546" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">Kan ikke</text>
<text x="1210" y="561" text-anchor="start" font-family="Arial" font-size="12" fill="#425571">vurderes</text>
<line x1="86" y1="602" x2="1314" y2="602" stroke="#DDE3EC" stroke-width="0.8"/>
<rect x="56" y="652" width="1288" height="168" rx="10" fill="#FBF3F2" stroke="#E4B4B0" stroke-width="1.4"/>
<text x="86" y="686" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#B23A3A">Ingen af de fem har en ejer med mandat</text>
<text x="86" y="716" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Tre har ingen udpeget. Én har en udpeget uden mandat over årsagen. Én er ubekendt. Risikoen ligger mellem to</text>
<text x="86" y="736" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">ansvarsområder, og et ansvar der deles af to, bæres af ingen. Et ejerskabshul kan skrives ned og lukkes på et møde - en</text>
<text x="86" y="756" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">hændelse kan ikke.</text>
</svg>