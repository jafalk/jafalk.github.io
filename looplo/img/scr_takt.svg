<text x="56" y="90" text-anchor="start" font-family="Arial" font-size="27" font-weight="bold" fill="#14294A">Takt · sync mellem domæner</text>
<text x="56" y="118" text-anchor="start" font-family="Arial" font-size="14" fill="#425571">Indbyrdes afstand. Ude af takt er OK, hvis nogen har forberedt det. Rødt felt = koblingen er ved at knække.</text>
