<text x="725" y="802" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Uforberedt</text>
<rect x="910" y="160" width="434" height="210" rx="10" fill="#FBF3F2" stroke="#E4B4B0" stroke-width="1.4"/>
<text x="936" y="194" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#B23A3A">To uforberedte afstande</text>
<text x="936" y="222" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">EA mod EQ og AI mod EQ er begge røde. Der er</text>
<text x="936" y="240" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">ikke aftalt noget interface mellem dem, og</text>
<text x="936" y="258" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">afstanden bliver ikke mindre af sig selv.</text>
<text x="936" y="346" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#B23A3A">Begge peger på EQ</text>
<rect x="910" y="388" width="434" height="200" rx="10" fill="#FCF6EA" stroke="#EAC9A0" stroke-width="1.4"/>
<text x="936" y="422" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#A5652C">Gul er ikke en fejl</text>
<text x="936" y="450" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">Gul betyder at der køres bevidst på en</text>
<text x="936" y="468" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">substitut. Det er en holdbar tilstand, så</text>
<text x="936" y="486" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">længe nogen ved det og har sat en udløbsdato</text>
<text x="936" y="504" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">på.</text>
<rect x="910" y="606" width="434" height="214" rx="10" fill="#EDF1F7" stroke="#DDE3EC" stroke-width="1.3"/>
<text x="936" y="640" text-anchor="start" font-family="Arial" font-size="14" font-weight="bold" fill="#14294A">Ude af takt kan være i orden</text>
<text x="936" y="668" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">To domæner må gerne bevæge sig forskelligt</text>
<text x="936" y="686" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">hurtigt. Det er kun et problem, når de er</text>
<text x="936" y="704" text-anchor="start" font-family="Arial" font-size="12.5" fill="#425571">koblet og ingen har forberedt afstanden.</text>
</svg>