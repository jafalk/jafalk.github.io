<!-- Looplo kerne-IP · Looplo_modningstrappe.svg · v1-0-0 · 2026-08-22 · kilde: se VERSION_kerne_ip.md -->
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1160" viewBox="0 0 1560 1160">
<rect width="1560" height="1160" fill="#FFFFFF"/>
<defs>
<marker id="a6B7685" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7685"/></marker>
<marker id="aC77D3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C77D3A"/></marker>
<marker id="aD0342C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D0342C"/></marker>
<marker id="a2E7D4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D4F"/></marker>
<marker id="a8A94A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8A94A3"/></marker><marker id="a3E5C76" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E5C76"/></marker></defs>
<text x="60" y="54" font-family="Georgia" font-size="31" font-weight="bold" fill="#141C2B">The maturity staircase</text>
<text x="60" y="83" font-family="Arial" font-size="14.5" fill="#6B7685">The client is bought in at step 2, where the pain is. Step 1 is delivered as a precondition. The goal is step 4, where Looplo takes up less room.</text>
<rect x="46" y="106" width="1468" height="46" rx="6" fill="#F6EFE6" stroke="#C77D3A" stroke-width="1.6"/>
<text x="66" y="126" font-family="Arial" font-size="13" font-weight="bold" fill="#C77D3A">EVERY CLIENT'S PAIN: the regulatory frame and verification of LLM output</text>
<text x="66" y="144" font-family="Arial" font-size="12" fill="#6B7685">That is what they ask for. Coupling measurement is what they need. The staircase connects the two.</text>
<rect x="46" y="176" width="1468" height="122" rx="6" fill="#FFFFFF" stroke="#8A94A3" stroke-width="2"/>
<rect x="46" y="176" width="7" height="122" fill="#8A94A3"/>
<rect x="76" y="194" width="80" height="26" rx="3" fill="#8A94A3"/>
<text x="116" y="212" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Step 0</text>
<text x="172" y="214" font-family="Georgia" font-size="19" font-weight="bold" fill="#141C2B">Chaos and pain</text>
<text x="76" y="242" font-family="Arial" font-size="12.5" fill="#6B7685">Agents make decisions. Nobody knows how many, in what language or against what standard. The clean-up after</text>
<text x="76" y="260" font-family="Arial" font-size="12.5" fill="#6B7685">grows linearly with use.</text>
<text x="76" y="282" font-family="Arial" font-size="12.3" font-weight="bold" fill="#8A94A3">The client feels it. The client cannot name it.</text>
<line x1="1104" y1="190" x2="1104" y2="284" stroke="#8A94A3" stroke-width="1" stroke-dasharray="4,4"/>
<text x="1128" y="210" font-family="Arial" font-size="11.5" font-weight="bold" fill="#8A94A3">FEE MODEL</text>
<text x="1128" y="232" font-family="Arial" font-size="13" font-weight="bold" fill="#141C2B">None</text>
<rect x="46" y="312" width="1468" height="122" rx="6" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
<rect x="46" y="312" width="7" height="122" fill="#3E5C76"/>
<rect x="76" y="330" width="80" height="26" rx="3" fill="#3E5C76"/>
<text x="116" y="348" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Step 1a</text>
<text x="172" y="350" font-family="Georgia" font-size="19" font-weight="bold" fill="#141C2B">Custody without installation</text>
<text x="76" y="378" font-family="Arial" font-size="12.5" fill="#6B7685">The couplings are mapped manually. Publicly available material is analyzed with an external model. The client's own material</text>
<text x="76" y="396" font-family="Arial" font-size="12.5" fill="#6B7685">is left untouched.</text>
<text x="76" y="418" font-family="Arial" font-size="12.3" font-weight="bold" fill="#3E5C76">The first measurement needs no installation and no access to confidential data.</text>
<line x1="1104" y1="326" x2="1104" y2="420" stroke="#8A94A3" stroke-width="1" stroke-dasharray="4,4"/>
<text x="1128" y="346" font-family="Arial" font-size="11.5" font-weight="bold" fill="#8A94A3">FEE MODEL</text>
<text x="1128" y="368" font-family="Arial" font-size="13" font-weight="bold" fill="#141C2B">Fixed price per mapping</text>
<rect x="46" y="448" width="1468" height="122" rx="6" fill="#FFFFFF" stroke="#3E5C76" stroke-width="2"/>
<rect x="46" y="448" width="7" height="122" fill="#3E5C76"/>
<rect x="76" y="466" width="80" height="26" rx="3" fill="#3E5C76"/>
<text x="116" y="484" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Step 1b</text>
<text x="172" y="486" font-family="Georgia" font-size="19" font-weight="bold" fill="#141C2B">Custody with an inherent model</text>
<text x="76" y="514" font-family="Arial" font-size="12.5" fill="#6B7685">The instance runs in the client's environment. Mistral reads the client's documents behind the enclave boundary. Data classification sets</text>
<text x="76" y="532" font-family="Arial" font-size="12.5" fill="#6B7685">the enclave's scope.</text>
<text x="76" y="554" font-family="Arial" font-size="12.3" font-weight="bold" fill="#3E5C76">The measurement becomes continuous and verifiable. Zero bytes out.</text>
<line x1="1104" y1="462" x2="1104" y2="556" stroke="#8A94A3" stroke-width="1" stroke-dasharray="4,4"/>
<text x="1128" y="482" font-family="Arial" font-size="11.5" font-weight="bold" fill="#8A94A3">FEE MODEL</text>
<text x="1128" y="504" font-family="Arial" font-size="13" font-weight="bold" fill="#141C2B">Subscription per instance</text>
<rect x="46" y="584" width="1468" height="122" rx="6" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<rect x="46" y="584" width="7" height="122" fill="#2E7D4F"/>
<rect x="76" y="602" width="80" height="26" rx="3" fill="#2E7D4F"/>
<text x="116" y="620" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Step 2</text>
<text x="172" y="622" font-family="Georgia" font-size="19" font-weight="bold" fill="#141C2B">Verification with an interim layer</text>
<text x="76" y="650" font-family="Arial" font-size="12.5" fill="#6B7685">Looplo delivers a working concept set with built-in expiry. Verify sets the decoding boundary for the agents. Routine</text>
<text x="76" y="668" font-family="Arial" font-size="12.5" fill="#6B7685">passes with proof.</text>
<text x="76" y="690" font-family="Arial" font-size="12.3" font-weight="bold" fill="#2E7D4F">Catches that an answer has valid FORM. Not that it is right for the business.</text>
<line x1="1104" y1="598" x2="1104" y2="692" stroke="#8A94A3" stroke-width="1" stroke-dasharray="4,4"/>
<text x="1128" y="618" font-family="Arial" font-size="11.5" font-weight="bold" fill="#8A94A3">FEE MODEL</text>
<text x="1128" y="640" font-family="Arial" font-size="13" font-weight="bold" fill="#141C2B">Volume - and here's the trap</text>
<rect x="46" y="720" width="1468" height="122" rx="6" fill="#FFFFFF" stroke="#C77D3A" stroke-width="2"/>
<rect x="46" y="720" width="7" height="122" fill="#C77D3A"/>
<rect x="76" y="738" width="80" height="26" rx="3" fill="#C77D3A"/>
<text x="116" y="756" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Step 3</text>
<text x="172" y="758" font-family="Georgia" font-size="19" font-weight="bold" fill="#141C2B">The client's own SWM is added</text>
<text x="76" y="786" font-family="Arial" font-size="12.5" fill="#6B7685">The client's business concepts are built in, gradually. Looplo delivers the structure: how a concept is defined, versioned</text>
<text x="76" y="804" font-family="Arial" font-size="12.5" fill="#6B7685">and given an owner. The content is the client's.</text>
<text x="76" y="826" font-family="Arial" font-size="12.3" font-weight="bold" fill="#C77D3A">Now Verify catches that an answer is wrong, not only that it is well-formed.</text>
<line x1="1104" y1="734" x2="1104" y2="828" stroke="#8A94A3" stroke-width="1" stroke-dasharray="4,4"/>
<text x="1128" y="754" font-family="Arial" font-size="11.5" font-weight="bold" fill="#8A94A3">FEE MODEL</text>
<text x="1128" y="776" font-family="Arial" font-size="13" font-weight="bold" fill="#141C2B">Declining - by design</text>
<rect x="46" y="856" width="1468" height="122" rx="6" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<rect x="46" y="856" width="7" height="122" fill="#2E7D4F"/>
<rect x="76" y="874" width="80" height="26" rx="3" fill="#2E7D4F"/>
<text x="116" y="892" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#FFFFFF">Step 4</text>
<text x="172" y="894" font-family="Georgia" font-size="19" font-weight="bold" fill="#141C2B">Verification is phased out</text>
<text x="76" y="922" font-family="Arial" font-size="12.5" fill="#6B7685">When the layer holds, most decisions are right by construction. The need for verification falls. The client owns</text>
<text x="76" y="940" font-family="Arial" font-size="12.5" fill="#6B7685">the standard and can switch off Custody without the measurement dying.</text>
<text x="76" y="962" font-family="Arial" font-size="12.3" font-weight="bold" fill="#2E7D4F">The burden falls instead of growing. That is the whole promise delivered.</text>
<line x1="1104" y1="870" x2="1104" y2="964" stroke="#8A94A3" stroke-width="1" stroke-dasharray="4,4"/>
<text x="1128" y="890" font-family="Arial" font-size="11.5" font-weight="bold" fill="#8A94A3">FEE MODEL</text>
<text x="1128" y="912" font-family="Arial" font-size="13" font-weight="bold" fill="#141C2B">Low volume, high trust</text>
<line x1="1494" y1="196" x2="1494" y2="962" stroke="#D0342C" stroke-width="2.4" marker-end="url(#aD0342C)"/>
<text x="1486" y="594" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#D0342C" transform="rotate(-90 1486 594)">REVENUE PER CLIENT FALLS</text>
<rect x="46" y="998" width="1468" height="86" rx="6" fill="#FBF0F0" stroke="#D0342C" stroke-width="2"/>
<text x="76" y="1026" font-family="Arial" font-size="14" font-weight="bold" fill="#D0342C">The trap: the staircase is also a revenue staircase - and it points downward</text>
<text x="76" y="1048" font-family="Arial" font-size="12.5" fill="#6B7685">Step 2 is high volume and continuous. Step 4 is low volume. As the client matures, revenue falls - and Looplo gains a direct financial interest in the client staying on step 2.</text>
<text x="76" y="1068" font-family="Arial" font-size="12.5" font-weight="bold" fill="#141C2B">The pricing model must reward maturing. Otherwise the business contradicts the doctrine - and a sharp buyer finds that in twenty minutes.</text>
<text x="1500" y="1116" text-anchor="end" font-family="Arial" font-size="11.5" fill="#8A94A3">Looplo · maturity staircase · v1-0-0 · 22 August 2026</text>
</svg>