<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#FBFBFC"/>
<text x="56" y="52" text-anchor="start" font-family="Arial" font-size="13" font-weight="bold" fill="#3E5C76">4 · MÅLER</text>
<text x="56" y="90" text-anchor="start" font-family="Arial" font-size="27" font-weight="bold" fill="#14294A">Footholds · substitut-regnskabet</text>
<text x="56" y="118" text-anchor="start" font-family="Arial" font-size="14" fill="#425571">Hvor I står selv, og hvor I står på en andens skuldre. Fodfæste er ikke det samme som modenhed.</text>
<rect x="56" y="160" width="1288" height="470" rx="10" fill="#FFFFFF" stroke="#DDE3EC" stroke-width="1.3"/>
<text x="86" y="216" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#14294A">Enterprise Architecture</text>
<rect x="430" y="196" width="282.0" height="26" rx="3" fill="#2E7D4F"/>
<text x="571.0" y="214" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">60%</text>
<rect x="712.0" y="196" width="117.5" height="26" rx="3" fill="#E8A33D"/>
<text x="770.75" y="214" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">25%</text>
<rect x="829.5" y="196" width="70.5" height="26" rx="3" fill="#B23A3A"/>
<text x="864.75" y="214" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">15%</text>
<text x="930" y="215" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Tegningerne ligger hos jer. Begrebslaget gør ikke.</text>
<text x="86" y="298" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#14294A">Zero Trust</text>
<rect x="430" y="278" width="188.0" height="26" rx="3" fill="#2E7D4F"/>
<text x="524.0" y="296" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">40%</text>
<rect x="618.0" y="278" width="164.5" height="26" rx="3" fill="#E8A33D"/>
<text x="700.25" y="296" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">35%</text>
<rect x="782.5" y="278" width="117.5" height="26" rx="3" fill="#B23A3A"/>
<text x="841.25" y="296" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">25%</text>
<text x="930" y="297" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Politikkerne er jeres. Nøglerne ligger i leverandørens KMS.</text>
<text x="86" y="380" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#14294A">Hyperscale Cloud</text>
<rect x="430" y="360" width="117.5" height="26" rx="3" fill="#2E7D4F"/>
<text x="488.75" y="378" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">25%</text>
<rect x="547.5" y="360" width="141.0" height="26" rx="3" fill="#E8A33D"/>
<text x="618.0" y="378" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">30%</text>
<rect x="688.5" y="360" width="211.5" height="26" rx="3" fill="#B23A3A"/>
<text x="794.25" y="378" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">45%</text>
<text x="930" y="379" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Landing zones er bygget af partneren og vedligeholdes der.</text>
<text x="86" y="462" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#14294A">AI-kapabiliteter</text>
<rect x="430" y="442" width="70.5" height="26" rx="3" fill="#2E7D4F"/>
<text x="465.25" y="460" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">15%</text>
<rect x="500.5" y="442" width="94.0" height="26" rx="3" fill="#E8A33D"/>
<text x="547.5" y="460" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">20%</text>
<rect x="594.5" y="442" width="305.5" height="26" rx="3" fill="#B23A3A"/>
<text x="747.25" y="460" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">65%</text>
<text x="930" y="461" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Model, prompt og evaluering ligger uden for huset.</text>
<text x="86" y="544" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#14294A">Psykologisk tryghed</text>
<rect x="430" y="524" width="399.5" height="26" rx="3" fill="#2E7D4F"/>
<text x="629.75" y="542" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">85%</text>
<rect x="829.5" y="524" width="70.5" height="26" rx="3" fill="#E8A33D"/>
<text x="864.75" y="542" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="bold" fill="#FFFFFF">15%</text>
<text x="930" y="543" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Kan ikke købes og kan ikke outsources.</text>
<rect x="86" y="588" width="18" height="18" rx="3" fill="#2E7D4F"/>
<text x="111" y="602" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Eget fodfæste</text>
<rect x="316" y="588" width="18" height="18" rx="3" fill="#E8A33D"/>
<text x="341" y="602" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Delt med leverandør</text>
<rect x="546" y="588" width="18" height="18" rx="3" fill="#B23A3A"/>
<text x="571" y="602" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">Leverandørens</text>
<rect x="56" y="652" width="1288" height="168" rx="10" fill="#FBF3F2" stroke="#E4B4B0" stroke-width="1.4"/>
<text x="86" y="686" text-anchor="start" font-family="Arial" font-size="15" font-weight="bold" fill="#B23A3A">Fodfæste er ikke det samme som modenhed</text>
<text x="86" y="716" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">AI scorer 4 og har 15% fodfæste. Cloud scorer 5 og har 25%. Det høje tal er bygget af en anden, og det står og falder</text>
<text x="86" y="736" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">med en kontrakt. Et domæne kan være modent og lejet på samme tid - og substitut-gæld er OK når den er synlig og</text>
<text x="86" y="756" text-anchor="start" font-family="Arial" font-size="13" fill="#425571">tidsgrænset, farlig når den er glemt og permanent.</text>
</svg>